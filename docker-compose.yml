services:
  postgres:
    image: postgres:16-alpine
    container_name: alumni_portal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alumni_portal
    ports:
      - "5432:5432"
    volumes:
      - alumni_pg_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  alumni_pg_data:
